  // ฟิลด์ในตารางค่าใช้จ่าย + แถว + ตาราง
  var rowDefs = [

  grpRow.items = mkItems([grp]);
  grp.ownerCt = grpRow;

  ["tab-1_clone", "tab-2_clone", "tab-3_clone"].forEach(function (id) {
    var c = new Cmp({ id: id, xtype: "panel" });
    c.el = { dom: document.getElementById(id) };
    c.tab = { el: { dom: document.getElementById(id) } };

  window.Ext = {
    getVersion: function () { return { version: "6.2.0.981" }; },
    getCmp: function (id) { return registry[id] || null; },
    ComponentManager: { getAll: function () { return Object.keys(registry).map(function (k) { return registry[k]; }); } },

  console.log("[fixture] Ext stub ready —", Object.keys(registry).length, "components");
